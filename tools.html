    <meta charset="UTF-8">

    <title>常用工具 - GameHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        .tools-hero {
            background: linear-gradient(135deg, var(--secondary-bg) 0%, var(--highlight) 100%);
            padding: 60px 0;
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }
        .tools-hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tools-hero p {
            color: var(--text-secondary);
            font-size: 16px;
        }
        .tools-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .tool-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border-color: var(--accent);
        }
        .tool-card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .tool-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .tool-card .tool-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .tool-card .tool-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        .tool-card .tool-tag {
            background: rgba(233,69,96,0.15);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .tool-card .tool-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tool-card .tool-link {
            display: inline-block;
            padding: 8px 20px;
            background: var(--accent);
            color: #fff;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .tool-card .tool-link:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        .tool-card .tool-link.green {
            background: #27ae60;
        }
        .tool-card .tool-link.green:hover {
            background: #2ecc71;
        }
        .tool-card .tool-link.blue {
            background: #2980b9;
        }
        .tool-card .tool-link.blue:hover {
            background: #3498db;
        }
    </style>
</head>
<body>

                <a href="index.html">首页</a>

                <a href="tools.html" class="active">常用工具</a>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索工具...">
                <button class="search-btn" onclick="searchTools()">🔍</button>

    </header>

    <!-- 横幅区域 -->

        function renderTools(tools) {
            const grid = document.getElementById('toolsGrid');
            if (tools.length === 0) {
                grid.innerHTML = '<div class="no-results"><h2>没有找到匹配的工具</h2></div>';
                return;
            }
            grid.innerHTML = tools.map(tool => `
                <div class="tool-card">
                    <div class="tool-card-icon">${tool.icon}</div>
                    <h3>${tool.name}</h3>
                    <div class="tool-desc">${tool.desc}</div>
                    <div class="tool-tags">
                        ${tool.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
                    </div>
                    <div class="tool-links">
                        <a href="${tool.downloadUrl}" target="_blank" class="tool-link">${tool.downloadName}</a>
                    </div>
                </div>
            `).join('');
        }

        function searchTools() {
            const input = document.getElementById('searchInput');
            const keyword = input.value.trim().toLowerCase();
            if (!keyword) {
                renderTools(toolsData);
                return;
            }
            const filtered = toolsData.filter(t =>
                t.name.toLowerCase().includes(keyword) ||
                t.desc.toLowerCase().includes(keyword) ||
                t.tags.some(tag => tag.toLowerCase().includes(keyword))
            );
            renderTools(filtered);
        }

        // 回车搜索
        document.addEventListener('DOMContentLoaded', function() {
            renderTools(toolsData);
            document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchTools();
            });
        });
    </script>
</body>
</html>

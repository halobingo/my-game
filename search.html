<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 - GameHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <header class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">
                <span class="logo-icon">🎮</span>
                <span class="logo-text">GameHub</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="category.html?type=pc">PC游戏</a>
                <a href="tools.html">常用工具</a>
            </nav>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索游戏...">
                <button class="search-btn" onclick="handleSearch()">🔍</button>
            </div>
        </div>
    </header>

    <!-- 搜索结果 -->
    <main class="container search-results">
        <h1>搜索结果: <span id="searchKeyword"></span></h1>
        <p>找到 <span id="resultCount">0</span> 个相关游戏</p>

        <div class="games-grid" id="gamesGrid">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>加载中...</p>
            </div>
        </div>
        <div class="pagination" id="pagination"></div>
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 GameHub. All rights reserved.</p>
            <p>本页面仅作展示用途</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadGames();
            handleSearchResults();
        });

        // 回车搜索
        document.getElementById('searchInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>
